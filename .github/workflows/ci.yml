name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
      - run: uv sync --locked
      - name: Tesseract for the ocr tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not model"
      - name: Contract drift
        run: |
          uv run python -m docchat.cli.export_openapi > /tmp/openapi.json
          diff -u ../contracts/openapi.json /tmp/openapi.json

  eval:
    name: retrieval eval gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/backend/.models
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
      - run: uv sync --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.models
          key: embedding-${{ hashFiles('backend/src/docchat/adapters/fastembed_embedder.py') }}
      - name: Embedding model (pinned revision, verified offline)
        run: uv run python -m docchat.cli.download_model
      - name: Default configuration keeps its measured quality
        run: uv run pytest tests/eval -m model

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and type check
        run: npm run lint && npx next typegen && npm run typecheck
      - name: Tests
        run: npm test
      - name: Generated types drift
        run: |
          npx openapi-typescript ../contracts/openapi.json -o /tmp/schema.gen.ts
          diff -u src/shared/api/schema.gen.ts /tmp/schema.gen.ts

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test

  docker:
    name: docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted arm64 runners are free only for public repositories.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build (includes the offline embedding smoke test)
        run: docker compose build
      - name: Start without .env
        run: docker compose up -d
      - name: Wait for readiness through the proxy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: OCR works in the backend image
        run: docker compose exec -T backend python -m docchat.cli.ocr_selftest
      - name: Backend is not exposed on the host
        run: test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8000/api/health/live)" = "000"
      - if: always()
        run: docker compose down -v

  e2e:
    name: browser e2e (fake model)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright and Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Stack with the fake model, then without a key; both browser runs
        env:
          CI: "true"
        run: ./scripts/e2e.sh
      - name: Logs of the stack on failure
        if: failure()
        run: docker compose -p docchat-e2e logs --no-color --tail 200
      - name: Traces and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
