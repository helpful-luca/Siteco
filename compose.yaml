name: siteco-docchat

services:
  backend:
    build:
      context: ./backend
      # Only eval/results reaches the image (annex 11, 9.1); eval/.dockerignore leaves the rest out.
      additional_contexts:
        eval: ./eval
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      - path: .env
        required: false   # the app also starts without .env (search-only mode)
    environment:
      DATA_DIR: /data
      # Compose fills this from the shell or from .env, whichever is set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}   # `fake`: answers without Claude (tests, demo)
      MALWARE_SCAN: ${MALWARE_SCAN:-required}
      OCR: ${OCR:-on}      # Tesseract for scanned pages; `off` leaves them unsearchable
      CLAMD_HOST: clamav
    expose: ["8000"]      # no host port: only the frontend container can reach the backend
    volumes:
      - appdata:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s

  # Malware scan (clamd). Uploads wait in `scanning` until it answers; the backend does not
  # depend on it, so the app is usable while the signatures load (about a minute).
  # The Debian tag is multi-arch (amd64, arm64); the Alpine tags are amd64 only.
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    environment:
      # Signatures ship in the image, so an offline start works; freshclam updates them hourly
      # when online (it logs a warning and carries on without internet).
      FRESHCLAM_CHECKS: "1"
      # Accept files up to the upload limit (1 GB) and scan them completely.
      CLAMD_CONF_StreamMaxLength: 1100M
      CLAMD_CONF_MaxFileSize: 1100M
      CLAMD_CONF_MaxScanSize: 1100M
      CLAMD_CONF_MaxScanTime: "600000"
      # Reload new signatures in place instead of keeping two copies in memory.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    expose: ["3310"]      # no host port: only the backend talks to clamd
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started   # UI comes up at once and explains the loading phase
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10

volumes:
  appdata: {}
  clamav-db: {}
