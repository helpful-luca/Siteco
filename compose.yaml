name: siteco-docchat

services:
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      - path: .env
        required: false   # the app also starts without .env (search-only mode)
    environment:
      DATA_DIR: /data
      # Compose fills this from the shell or from .env, whichever is set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose: ["8000"]      # no host port: only the frontend container can reach the backend
    volumes:
      - appdata:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started   # UI comes up at once and explains the loading phase
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10

volumes:
  appdata: {}
