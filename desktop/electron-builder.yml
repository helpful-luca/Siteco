# Unsigned local build (ad-hoc signature only): `npm run app:build` in the repository root.
appId: local.siteco.document-chat
productName: Siteco Document Chat
copyright: Luca
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
asar: true
npmRebuild: false
electronLanguages: [de, en]
mac:
  target:
    - target: dir
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  # Ad-hoc signature: required to run on Apple silicon after the fuses change the binary.
  # Distribution would use a Developer ID certificate and notarization instead.
  identity: "-"
  hardenedRuntime: false
  darkModeSupport: true
  extendInfo:
    LSMinimumSystemVersion: "12.0"
    NSHumanReadableCopyright: ""
# Electron fuses (annex 11, 8.13): no Node mode, no NODE_OPTIONS or inspector flags,
# encrypted cookies, app code only from the integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
