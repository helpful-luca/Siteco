<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Siteco Document Chat</title>
    <link rel="stylesheet" href="splash.css" />
    <script src="splash.js" defer></script>
  </head>
  <body>
    <main class="splash" aria-busy="true">
      <div class="center">
      <img class="icon" src="icon.png" alt="" width="80" height="80" />
      <h1 class="name" id="name">Siteco Document Chat</h1>

      <section class="progress" id="progress">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="bar" aria-hidden="true"><div class="sweep"></div></div>
        <p class="hint" id="hint"></p>
      </section>

      <section class="problem" id="problem" hidden>
        <h2 class="title" id="error-title"></h2>
        <p class="body" id="error-body"></p>
        <div class="actions" id="actions"></div>
      </section>
      </div>

      <details class="details" id="details" hidden>
        <summary id="details-label">Details</summary>
        <pre id="details-text"></pre>
      </details>
    </main>
  </body>
</html>
